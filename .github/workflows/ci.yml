name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify + package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: shell syntax
        run: |
          set -eux
          sh -n plasmoid/io.github.localsend.plasmoid/contents/backend/manage.sh
          bash -n scripts/install.sh scripts/uninstall.sh scripts/restart-plasma.sh scripts/package.sh

      - name: backend byte-compiles
        run: |
          set -eux
          python3 -m py_compile python/localsendd python/localsendctl
          python3 -m compileall -q python/tests

      - name: unit and protocol tests
        run: python3 -m unittest discover -s python/tests -t python/tests -v

      - name: build the plasmoid archive
        run: ./scripts/package.sh --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: plasmoid-${{ github.sha }}
          path: dist/*.plasmoid
          if-no-files-found: error
          retention-days: 14
