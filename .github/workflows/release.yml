name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build + publish
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: resolve version from the tag
        id: version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag '$TAG' is not on main; refusing to release"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: tests
        run: python3 -m unittest discover -s python/tests -t python/tests -v

      - name: build the plasmoid archive
        run: |
          set -euo pipefail
          ./scripts/package.sh --version "${{ steps.version.outputs.version }}" --out dist | tee package.log
          tail -n 1 package.log | sed 's/^/sha256: /'

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.plasmoid > SHA256SUMS
          cat SHA256SUMS

      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "LocalSend applet ${TAG}" \
            --generate-notes \
            --verify-tag \
            dist/*.plasmoid dist/SHA256SUMS
